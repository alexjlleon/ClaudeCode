<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WU Traffic</title>
<style>
  :root{
    --ink:#1c2128;
    --dim:#5b6472;
    --line:#e3e6ea;
    --bg:#fbfbfc;
    --panel:#ffffff;
    --pageview:#f4f5f7;
    --milestone:#fff3c4;
    --success:#d9f4dd;
    --error:#fbdcd9;
    --accent:#2f6f4f;
    font-size:15px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12.5px;
    color:var(--dim);
  }
  .controls{
    display:flex;
    gap:8px;
    align-items:center;
    padding:12px 20px;
    flex-wrap:wrap;
  }
  .controls input, .controls select{
    font:inherit;
    font-size:13px;
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
  }
  .controls button{
    font:inherit;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--accent);
    color:var(--accent);
    background:var(--panel);
    border-radius:6px;
    cursor:pointer;
  }
  .controls button:hover{ background:#eef6f1; }
  .controls .spacer{ flex:1; }
  .auto{ font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:5px; }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
  }
  thead th{
    text-align:left;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--dim);
    font-weight:600;
    padding:8px 20px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--panel);
  }
  tbody td{
    padding:9px 20px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    font-size:13.5px;
  }
  td.when{ white-space:nowrap; color:var(--dim); font-variant-numeric:tabular-nums; }
  td.ip{ white-space:nowrap; font-family:"SF Mono",Consolas,monospace; font-size:12.5px; color:var(--dim); }
  td.ip button{
    border:none; background:none; color:inherit; cursor:pointer; font-family:inherit; font-size:inherit;
    text-decoration:underline; text-underline-offset:2px; padding:0;
  }
  tr.type-milestone td{ background:var(--milestone); }
  tr.type-success   td{ background:var(--success); }
  tr.type-error     td{ background:var(--error); }
  tr.type-pageview  td.label{ color:var(--dim); }

  .pager{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px 24px;
    font-size:13px;
    color:var(--dim);
  }
  .pager button{
    border:1px solid var(--line);
    background:var(--panel);
    padding:5px 11px;
    border-radius:6px;
    cursor:pointer;
    color:var(--ink);
  }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .empty{ padding:40px 20px; color:var(--dim); text-align:center; font-size:13.5px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>WU Traffic</h1>
    <div class="sub">weddingsunlimited.com — visitor &amp; funnel activity</div>
  </div>
  <div class="sub" id="total">—</div>
</header>

<div class="controls">
  <input id="sessionFilter" type="text" placeholder="Filter by session id…" />
  <button id="applyFilter">Filter</button>
  <button id="clearFilter">Clear</button>
  <span class="spacer"></span>
  <label class="auto"><input type="checkbox" id="autoRefresh" checked /> Auto-refresh (15s)</label>
</div>

<table>
  <thead>
    <tr><th style="width:150px;">Created</th><th style="width:130px;">IP address</th><th>Event</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="emptyMsg" style="display:none;">No events yet — once the tracker snippet is live on the site, activity will show up here.</div>

<div class="pager">
  <button id="prev">&larr; Prev</button>
  <span id="pageLabel">Page 1</span>
  <button id="next">Next &rarr;</button>
</div>

<script>
  let page = 1;
  let sessionId = null;
  let timer = null;

  function rowClass(type){
    if (type === 'success') return 'type-success';
    if (type === 'error') return 'type-error';
    if (type === 'milestone') return 'type-milestone';
    if (type === 'pageview') return 'type-pageview';
    return '';
  }

  function fmtTime(iso){
    // SQLite gives UTC "YYYY-MM-DD HH:MM:SS" -- render in the browser's local time.
    const d = new Date(iso.replace(' ', 'T') + 'Z');
    return d.toLocaleString(undefined, {
      month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
    });
  }

  async function load(){
    const params = new URLSearchParams({ page });
    if (sessionId) params.set('session_id', sessionId);
    const res = await fetch('/api/events?' + params.toString());
    if (!res.ok) return;
    const data = await res.json();

    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = data.rows.length ? 'none' : 'block';

    for (const r of data.rows){
      const tr = document.createElement('tr');
      tr.className = rowClass(r.event_type);
      tr.innerHTML = `
        <td class="when">${fmtTime(r.created_at)}</td>
        <td class="ip"><button title="Filter to this session" data-sid="${r.session_id || ''}">${r.ip_address || '—'}</button></td>
        <td class="label">${r.label}</td>
      `;
      tbody.appendChild(tr);
    }

    document.getElementById('total').textContent = data.total + ' total events';
    document.getElementById('pageLabel').textContent = 'Page ' + data.page;
    document.getElementById('prev').disabled = data.page <= 1;
    document.getElementById('next').disabled = data.page * data.pageSize >= data.total;

    tbody.querySelectorAll('button[data-sid]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!btn.dataset.sid) return;
        sessionId = btn.dataset.sid;
        document.getElementById('sessionFilter').value = sessionId;
        page = 1;
        load();
      });
    });
  }

  document.getElementById('applyFilter').addEventListener('click', () => {
    sessionId = document.getElementById('sessionFilter').value.trim() || null;
    page = 1;
    load();
  });
  document.getElementById('clearFilter').addEventListener('click', () => {
    sessionId = null;
    document.getElementById('sessionFilter').value = '';
    page = 1;
    load();
  });
  document.getElementById('prev').addEventListener('click', () => { if (page > 1){ page--; load(); }});
  document.getElementById('next').addEventListener('click', () => { page++; load(); });

  function setupAutoRefresh(){
    if (timer) clearInterval(timer);
    if (document.getElementById('autoRefresh').checked){
      timer = setInterval(() => { if (page === 1 && !sessionId) load(); }, 15000);
    }
  }
  document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);

  load();
  setupAutoRefresh();
</script>
</body>
</html>
