<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WU Traffic</title>
<style>
  :root{
    --ink:#1c2128;
    --dim:#5b6472;
    --line:#e3e6ea;
    --bg:#fbfbfc;
    --panel:#ffffff;
    --pageview:#f4f5f7;
    --milestone:#fff3c4;
    --success:#d9f4dd;
    --error:#fbdcd9;
    --timing:#e5eefc;
    --accent:#2f6f4f;
    font-size:15px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  header .sub{
    font-size:12.5px;
    color:var(--dim);
  }
  .tabs{
    display:flex;
    gap:4px;
    padding:10px 20px 0;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .tabs button{
    font:inherit;
    font-size:13.5px;
    padding:8px 16px;
    border:1px solid transparent;
    border-bottom:none;
    background:none;
    color:var(--dim);
    cursor:pointer;
    border-radius:6px 6px 0 0;
  }
  .tabs button.active{
    color:var(--ink);
    background:var(--bg);
    border-color:var(--line);
    font-weight:600;
  }
  .controls{
    display:flex;
    gap:8px;
    align-items:center;
    padding:12px 20px;
    flex-wrap:wrap;
  }
  .controls input, .controls select{
    font:inherit;
    font-size:13px;
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel);
  }
  .controls button{
    font:inherit;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--accent);
    color:var(--accent);
    background:var(--panel);
    border-radius:6px;
    cursor:pointer;
  }
  .controls button:hover{ background:#eef6f1; }
  .controls .spacer{ flex:1; }
  .auto{ font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:5px; }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
  }
  thead th{
    text-align:left;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--dim);
    font-weight:600;
    padding:8px 20px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--panel);
  }
  tbody td{
    padding:9px 20px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    font-size:13.5px;
  }
  td.when{ white-space:nowrap; color:var(--dim); font-variant-numeric:tabular-nums; }
  td.ip{ white-space:nowrap; font-family:"SF Mono",Consolas,monospace; font-size:12.5px; color:var(--dim); }
  td.ip button{
    border:none; background:none; color:inherit; cursor:pointer; font-family:inherit; font-size:inherit;
    text-decoration:underline; text-underline-offset:2px; padding:0;
  }
  td.loc{ white-space:nowrap; color:var(--dim); font-size:12.5px; }
  td.device{ white-space:nowrap; font-size:12.5px; }
  td.ref{ font-size:12px; color:var(--dim); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.label{ display:flex; align-items:center; gap:0; flex-wrap:wrap; }
  tr.type-milestone td{ background:var(--milestone); }
  tr.type-success   td{ background:var(--success); }
  tr.type-error     td{ background:var(--error); }
  tr.type-timing    td{ background:var(--timing); }
  tr.type-pageview  td.label{ color:var(--dim); }
  tr.type-click     td.label{ color:var(--dim); }

  .thumb{
    height:22px; width:22px; object-fit:cover; border-radius:3px;
    margin-right:7px; vertical-align:middle; border:1px solid var(--line);
    flex-shrink:0;
  }
  .count-pill{
    display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:10px;
    margin-left:7px; background:var(--line); color:var(--dim); font-weight:600;
  }

  /* Visitor (grouped) rows */
  tr.visitor{ cursor:pointer; }
  tr.visitor:hover td{ background:#f4f8f5; }
  tr.visitor td.ipname{ font-family:"SF Mono",Consolas,monospace; font-size:12.5px; }
  .twist{ display:inline-block; width:12px; color:var(--dim); }
  td.count{ text-align:right; font-variant-numeric:tabular-nums; }
  tr.subrow td{ background:#fafbfc; font-size:12.5px; padding:6px 20px 6px 44px; color:var(--dim); }
  tr.subrow .stime{ color:var(--dim); margin-right:10px; font-variant-numeric:tabular-nums; }
  tr.subrow img.thumb{ height:16px; width:16px; margin-right:5px; }
  .pill{ display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .pill.milestone{ background:var(--milestone); }
  .pill.success{ background:var(--success); }
  .pill.error{ background:var(--error); }
  .pill.timing{ background:var(--timing); }

  .pager{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px 24px;
    font-size:13px;
    color:var(--dim);
  }
  .pager button{
    border:1px solid var(--line);
    background:var(--panel);
    padding:5px 11px;
    border-radius:6px;
    cursor:pointer;
    color:var(--ink);
  }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .empty{ padding:40px 20px; color:var(--dim); text-align:center; font-size:13.5px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>WU Traffic</h1>
    <div class="sub">weddingsunlimited.com &mdash; visitor &amp; funnel activity</div>
  </div>
  <div class="sub" id="total">&mdash;</div>
</header>

<div class="tabs">
  <button id="tabEvents" class="active">Events</button>
  <button id="tabVisitors">By Visitor</button>
</div>

<div class="controls" id="eventsControls">
  <input id="sessionFilter" type="text" placeholder="Filter by session id&hellip;" />
  <button id="applyFilter">Filter</button>
  <button id="clearFilter">Clear</button>
  <span class="spacer"></span>
  <label class="auto"><input type="checkbox" id="autoRefresh" checked /> Auto-refresh (15s)</label>
</div>

<!-- Flat events view -->
<div id="eventsView">
  <table>
    <thead>
      <tr>
        <th style="width:130px;">Created</th>
        <th style="width:115px;">IP address</th>
        <th style="width:150px;">Location</th>
        <th style="width:95px;">Device</th>
        <th style="width:180px;">Referrer</th>
        <th>Event</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<!-- Grouped by visitor view -->
<div id="visitorsView" style="display:none;">
  <table>
    <thead>
      <tr>
        <th style="width:150px;">IP address</th>
        <th style="width:180px;">Location</th>
        <th style="width:100px;">Device</th>
        <th style="width:70px;">Events</th>
        <th style="width:140px;">First seen</th>
        <th style="width:140px;">Last seen</th>
      </tr>
    </thead>
    <tbody id="visitorRows"></tbody>
  </table>
</div>

<div class="empty" id="emptyMsg" style="display:none;">No events yet &mdash; once the tracker snippet is live on the site, activity will show up here.</div>

<div class="pager">
  <button id="prev">&larr; Prev</button>
  <span id="pageLabel">Page 1</span>
  <button id="next">Next &rarr;</button>
</div>

<script>
  let page = 1;
  let sessionId = null;
  let timer = null;
  let mode = 'events'; // 'events' | 'visitors'

  function rowClass(type){
    if (type === 'success') return 'type-success';
    if (type === 'error') return 'type-error';
    if (type === 'milestone') return 'type-milestone';
    if (type === 'pageview') return 'type-pageview';
    if (type === 'timing') return 'type-timing';
    if (type === 'click') return 'type-click';
    return '';
  }

  function fmtTime(iso){
    if (!iso) return '';
    const d = new Date(iso.replace(' ', 'T') + 'Z');
    return d.toLocaleString(undefined, {
      month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
    });
  }

  function fmtLoc(city, region, country){
    const parts = [city, region].filter(Boolean);
    let s = parts.join(', ');
    if (!s && country) s = country;
    else if (s && country && country !== 'United States') s += ', ' + country;
    return s || '&mdash;';
  }

  function fmtDevice(d){
    if (d === 'Mobile') return '&#128241; Mobile';
    if (d === 'Tablet') return '&#128241; Tablet';
    if (d === 'Desktop') return '&#128187; Desktop';
    if (d === 'Bot') return '&#129302; Bot';
    return '&mdash;';
  }

  function fmtRef(ref){
    if (!ref) return '&mdash;';
    try {
      const u = new URL(ref);
      return esc(u.hostname.replace(/^www\./, '') + u.pathname).slice(0, 40);
    } catch(e){
      return esc(ref).slice(0, 40);
    }
  }

  // Seconds/minutes, e.g. "45s" or "2m 14s"
  function fmtDuration(ms){
    if (ms == null || isNaN(ms)) return '&mdash;';
    const totalSec = Math.round(ms / 1000);
    if (totalSec < 60) return totalSec + 's';
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + 'm' + (s ? ' ' + s + 's' : '');
  }

  function esc(s){
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function parseMeta(r){
    if (!r || !r.meta) return null;
    try { return JSON.parse(r.meta); } catch(e){ return null; }
  }

  // Builds the inner HTML for the "Event" / label cell -- handles plain
  // labels, time-on-page durations, and image-click thumbnails.
  function describeLabel(r){
    const meta = parseMeta(r);
    if (r.event_type === 'timing' && meta && meta.duration_ms != null){
      return 'Time on page: ' + fmtDuration(meta.duration_ms);
    }
    if (r.event_type === 'click' && meta && meta.tag === 'img' && meta.src){
      return `<img class="thumb" src="${esc(meta.src)}" alt="" loading="lazy">` + esc(r.label);
    }
    return esc(r.label);
  }

  // Collapses consecutive click events from the same session on the same
  // element into a single row with a "xN" count, so rapid/repeat clicks
  // (double-clicks, mis-taps) don't flood the feed.
  function groupClicks(rows){
    const out = [];
    for (const r of rows){
      const last = out[out.length - 1];
      if (
        r.event_type === 'click' && last && last.event_type === 'click' &&
        last.session_id === r.session_id && last.label === r.label
      ){
        last.__count = (last.__count || 1) + 1;
        continue;
      }
      out.push(Object.assign({}, r, { __count: 1 }));
    }
    return out;
  }

  async function loadEvents(){
    const params = new URLSearchParams({ page });
    if (sessionId) params.set('session_id', sessionId);
    const res = await fetch('/api/events?' + params.toString());
    if (!res.ok) return;
    const data = await res.json();

    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = data.rows.length ? 'none' : 'block';

    const grouped = groupClicks(data.rows);

    for (const r of grouped){
      const tr = document.createElement('tr');
      tr.className = rowClass(r.event_type);
      const countBadge = r.__count > 1 ? `<span class="count-pill">&times;${r.__count}</span>` : '';
      tr.innerHTML = `
        <td class="when">${fmtTime(r.created_at)}</td>
        <td class="ip"><button title="Filter to this session" data-sid="${esc(r.session_id || '')}">${esc(r.ip_address || '\u2014')}</button></td>
        <td class="loc">${fmtLoc(r.geo_city, r.geo_region, r.geo_country)}</td>
        <td class="device">${fmtDevice(r.device_type)}</td>
        <td class="ref" title="${esc(r.referrer || '')}">${fmtRef(r.referrer)}</td>
        <td class="label">${describeLabel(r)}${countBadge}</td>
      `;
      tbody.appendChild(tr);
    }

    document.getElementById('total').textContent = data.total + ' total events';
    document.getElementById('pageLabel').textContent = 'Page ' + data.page;
    document.getElementById('prev').disabled = data.page <= 1;
    document.getElementById('next').disabled = data.page * data.pageSize >= data.total;

    tbody.querySelectorAll('button[data-sid]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!btn.dataset.sid) return;
        sessionId = btn.dataset.sid;
        document.getElementById('sessionFilter').value = sessionId;
        page = 1;
        loadEvents();
      });
    });
  }

  async function loadVisitors(){
    const params = new URLSearchParams({ page });
    const res = await fetch('/api/visitors?' + params.toString());
    if (!res.ok) return;
    const data = await res.json();

    const tbody = document.getElementById('visitorRows');
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = data.rows.length ? 'none' : 'block';

    for (const v of data.rows){
      const tr = document.createElement('tr');
      tr.className = 'visitor';
      tr.innerHTML = `
        <td class="ipname"><span class="twist">&#9656;</span>${esc(v.ip_address || '\u2014')}</td>
        <td class="loc">${fmtLoc(v.geo_city, v.geo_region, v.geo_country)}</td>
        <td class="device">${fmtDevice(v.device_type)}</td>
        <td class="count">${v.event_count}</td>
        <td class="when">${fmtTime(v.first_seen)}</td>
        <td class="when">${fmtTime(v.last_seen)}</td>
      `;
      tbody.appendChild(tr);

      tr.addEventListener('click', async () => {
        const next = tr.nextElementSibling;
        const twist = tr.querySelector('.twist');
        if (next && next.classList.contains('subrow')){
          next.remove();
          twist.innerHTML = '&#9656;';
          return;
        }
        twist.innerHTML = '&#9662;';
        const er = await fetch('/api/visitor-events?ip=' + encodeURIComponent(v.ip_address));
        if (!er.ok) return;
        const ed = await er.json();
        const sub = document.createElement('tr');
        sub.className = 'subrow';
        const items = groupClicks(ed.rows).map(e => {
          const cls = ['milestone','success','error','timing'].includes(e.event_type) ? e.event_type : '';
          const pill = cls ? `<span class="pill ${cls}">${cls}</span>` : '';
          const ref = e.referrer ? ` &middot; <span title="${esc(e.referrer)}">from ${fmtRef(e.referrer)}</span>` : '';
          const countBadge = e.__count > 1 ? `<span class="count-pill">&times;${e.__count}</span>` : '';
          return `<div><span class="stime">${fmtTime(e.created_at)}</span>${describeLabel(e)}${countBadge}${pill}${ref}</div>`;
        }).join('');
        sub.innerHTML = `<td colspan="6">${items || 'No events.'}</td>`;
        tr.after(sub);
      });
    }

    document.getElementById('total').textContent = data.total + ' unique visitors';
    document.getElementById('pageLabel').textContent = 'Page ' + data.page;
    document.getElementById('prev').disabled = data.page <= 1;
    document.getElementById('next').disabled = data.page * data.pageSize >= data.total;
  }

  function load(){
    if (mode === 'events') return loadEvents();
    return loadVisitors();
  }

  document.getElementById('tabEvents').addEventListener('click', () => {
    mode = 'events'; page = 1;
    document.getElementById('tabEvents').classList.add('active');
    document.getElementById('tabVisitors').classList.remove('active');
    document.getElementById('eventsView').style.display = '';
    document.getElementById('visitorsView').style.display = 'none';
    document.getElementById('eventsControls').style.display = '';
    load();
  });
  document.getElementById('tabVisitors').addEventListener('click', () => {
    mode = 'visitors'; page = 1; sessionId = null;
    document.getElementById('tabVisitors').classList.add('active');
    document.getElementById('tabEvents').classList.remove('active');
    document.getElementById('visitorsView').style.display = '';
    document.getElementById('eventsView').style.display = 'none';
    document.getElementById('eventsControls').style.display = 'none';
    load();
  });

  document.getElementById('applyFilter').addEventListener('click', () => {
    sessionId = document.getElementById('sessionFilter').value.trim() || null;
    page = 1;
    loadEvents();
  });
  document.getElementById('clearFilter').addEventListener('click', () => {
    sessionId = null;
    document.getElementById('sessionFilter').value = '';
    page = 1;
    loadEvents();
  });
  document.getElementById('prev').addEventListener('click', () => { if (page > 1){ page--; load(); }});
  document.getElementById('next').addEventListener('click', () => { page++; load(); });

  function setupAutoRefresh(){
    if (timer) clearInterval(timer);
    if (document.getElementById('autoRefresh').checked){
      timer = setInterval(() => { if (mode === 'events' && page === 1 && !sessionId) loadEvents(); }, 15000);
    }
  }
  document.getElementById('autoRefresh').addEventListener('change', setupAutoRefresh);

  load();
  setupAutoRefresh();
</script>
</body>
</html>
